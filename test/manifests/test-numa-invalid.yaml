apiVersion: v1
kind: Pod
metadata:
  name: test-numa-invalid
  namespace: default
spec:
  containers:
    - name: test
      image: busybox:latest
      command: ["sh", "-c", "sleep infinity"]
      resources:
        requests:
          cpu: "1"
          memory: 256Mi
          numa-align/numa-99: 1  # Non-existent NUMA node
        limits:
          cpu: "1"
          memory: 256Mi
          numa-align/numa-99: 1
  restartPolicy: Never
