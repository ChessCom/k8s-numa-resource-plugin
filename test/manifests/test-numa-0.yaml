apiVersion: v1
kind: Pod
metadata:
  name: test-numa-0
  namespace: default
spec:
  containers:
    - name: test
      image: busybox:latest
      command: ["sh", "-c", "echo NUMA_NODE=$NUMA_NODE && cat /proc/self/status | grep -E '(Cpus_allowed|Mems_allowed)' && sleep infinity"]
      resources:
        # Integer CPU required for CPU Manager to pin to specific cores
        # Guaranteed QoS (requests == limits) required for Topology Manager
        requests:
          cpu: "1"
          memory: 256Mi
          numa-align/numa-0: 1
        limits:
          cpu: "1"
          memory: 256Mi
          numa-align/numa-0: 1
  restartPolicy: Never
